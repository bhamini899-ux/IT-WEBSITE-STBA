    <path class="stba-leaf" d="M 226,112 C 221,104 230,96 238,98 C 245,101 246,112 239,117 C 233,121 225,119 226,112 Z" />
    <path class="stba-leaf" d="M 232,70 C 228,62 237,54 246,58 C 253,61 254,71 247,77 C 240,82 232,79 232,70 Z" />
    <path class="stba-leaf" d="M 268,70 C 272,62 263,54 254,58 C 247,61 246,71 253,77 C 260,82 268,79 268,70 Z" />
    <path class="stba-leaf" d="M 274,112 C 279,104 270,96 262,98 C 255,101 254,112 261,117 C 267,121 275,119 274,112 Z" />
    <path class="stba-leaf" d="M 302,92 C 307,84 298,76 290,79 C 282,82 282,93 289,98 C 295,102 303,100 302,92 Z" />
