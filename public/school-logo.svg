<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Playfair+Display:wght@500;600&amp;display=swap');
      .stba-navy-text {
        font-family: 'Cinzel', 'Playfair Display', 'Times New Roman', Times, Georgia, serif;
        fill: #102a56;
      }
      .stba-tree-line {
        fill: none;
        stroke: #102a56;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .stba-tree-line-thin {
        fill: none;
        stroke: #102a56;
        stroke-width: 3.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .stba-leaf {
        fill: #f07818;
      }
    </style>
    <!-- Text arc path from left to right along upper semicircle (r = 196) -->
    <path id="stbaTextArc" d="M 62,310 A 196,196 0 1,1 438,310" fill="none" />
  </defs>

  <!-- Circular background -->
  <circle cx="250" cy="250" r="246" fill="#ffffff" />

  <!-- Outer Navy Ring -->
  <circle cx="250" cy="250" r="244" fill="none" stroke="#102a56" stroke-width="5.5" />

  <!-- Inner Concentric Ring -->
  <circle cx="250" cy="250" r="232" fill="none" stroke="#102a56" stroke-width="1.8" />

  <!-- Upper Arc: SETH TOLARAM BAFNA ACADEMY -->
  <text class="stba-navy-text" font-size="27.5" font-weight="600" letter-spacing="4.8">
    <textPath href="#stbaTextArc" startOffset="50%" text-anchor="middle">
      SETH TOLARAM BAFNA ACADEMY
    </textPath>
  </text>

  <!-- Bottom Brand Text: STBA -->
  <text x="250" y="432" class="stba-navy-text" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="6">
    STBA
  </text>

  <!-- Bottom Foundation Year: ESTD 1994 -->
  <text x="250" y="468" class="stba-navy-text" font-size="21" font-weight="500" text-anchor="middle" letter-spacing="4.5">
